version: '3.9'
services:
  threadshare:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_USER: threadshare_user
      DB_PASSWORD: securepassword123
      DB_NAME: threadshare_db
      REDIS_HOST: redis  # Redis service name as the host
      ASPNETCORE_ENVIRONMENT: Development

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: threadshare_user
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: threadshare_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine  # Official Redis image (lightweight version)
    ports:
      - "6379:6379"  # Expose Redis on port 6379
