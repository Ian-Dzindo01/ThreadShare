version: '3.9'
services:
  threadshare:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # Map host port 8080 to container port 80
    depends_on:
      - db
      - redis
    environment:
      DB_HOST: db
      DB_USER: threadshare_user
      DB_PASSWORD: yourpassword
      DB_NAME: threadshare_db
      REDIS_HOST: redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: threadshare_user
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: threadshare_db
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"